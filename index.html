<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webcam Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top-bar">
    <span class="title">Webcam Viewer</span>
    <button id="grant-btn">Grant camera access</button>
    <select id="camera-select" hidden disabled>
      <option value="">-- select camera --</option>
    </select>
    <button id="add-btn" hidden disabled>Add</button>
    <div id="size-btns">
      <button class="size-btn" data-size="s">S</button>
      <button class="size-btn" data-size="m">M</button>
      <button class="size-btn" data-size="l">L</button>
    </div>
  </header>

  <p id="status">Grant camera access to begin.</p>

  <main id="grid"></main>

  <script type="module" src="app.js"></script>
</body>
</html>
